<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b2a2e" />
  <title>Bloom Drops</title>
  <link rel="icon" href="assets/bloom-drops-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="fireflies" aria-hidden="true"></div>

  <main class="shell">
    <header class="top">
      <div class="brand">
        <img class="brand-icon" src="assets/bloom-drops-icon.png" alt="" width="48" height="48" />
        <div>
          <h1>Bloom Drops</h1>
          <p class="tagline">Link essences. Burst blooms. Harvest the meadow.</p>
        </div>
      </div>
      <div class="hud">
        <div class="stat">
          <span class="label">Level</span>
          <strong id="levelNum">1</strong>
        </div>
        <div class="stat">
          <span class="label">Moves</span>
          <strong id="movesLeft">20</strong>
        </div>
        <div class="stat">
          <span class="label">Score</span>
          <strong id="scoreVal">0</strong>
        </div>
      </div>
    </header>

    <section class="goals" id="goals" aria-label="Level goals"></section>

    <section class="board-wrap">
      <canvas id="board" width="420" height="420" aria-label="Bloom Drops puzzle board"></canvas>
      <p class="hint" id="hint">Drag matching drops. Close a loop for a Bloom Burst.</p>
    </section>

    <footer class="actions">
      <button type="button" class="btn ghost" id="btnRestart">Restart</button>
      <button type="button" class="btn" id="btnNext" hidden>Next level</button>
    </footer>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <img src="assets/bloom-drops-icon.png" alt="" width="72" height="72" />
      <h2 id="modalTitle">Meadow cleared</h2>
      <p id="modalBody">You harvested every essence before dusk.</p>
      <button type="button" class="btn" id="modalBtn">Continue</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
